name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: mdm
          POSTGRES_DB: mdm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mdm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MDM_TEST_DATABASE_URL: postgres://mdm:mdm@localhost:5432/mdm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go vet
        run: go vet ./...
      - name: go vet (Windows)
        run: GOOS=windows go vet ./internal/agent/... ./cmd/mdm-agent/
      - name: Pruebas con el detector de carreras
        run: go test -race -count=1 ./...
      - name: Compilación de todos los binarios
        run: make build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/install_test.sh scripts/e2e.sh
      - name: Pruebas del instalador
        run: sudo sh scripts/install_test.sh

  e2e:
    runs-on: ubuntu-24.04
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: Prueba de extremo a extremo con Docker
        run: sh scripts/e2e.sh
